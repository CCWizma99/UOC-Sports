<!DOCTYPE html>
<html>
<head>
    <title>Chart API Test</title>
</head>
<body>
    <h1>Chart API Test</h1>
    <div id="output"></div>
    
    <script>
        async function testAPI() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing API...</p>';
            
            try {
                const url = '/uoc-sports/public/reserve-facilities/chart?facility_id=1&date=2026-02-17';
                output.innerHTML += `<p>Fetching: ${url}</p>`;
                
                const response = await fetch(url);
                output.innerHTML += `<p>Status: ${response.status}</p>`;
                
                const text = await response.text();
                output.innerHTML += `<p>Raw Response:</p><pre>${text}</pre>`;
                
                try {
                    const json = JSON.parse(text);
                    output.innerHTML += `<p>Parsed JSON:</p><pre>${JSON.stringify(json, null, 2)}</pre>`;
                } catch (e) {
                    output.innerHTML += `<p>JSON Parse Error: ${e.message}</p>`;
                }
            } catch (e) {
                output.innerHTML += `<p>Error: ${e.message}</p>`;
            }
        }
        
        testAPI();
    </script>
</body>
</html>
