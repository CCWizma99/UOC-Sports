<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Balance API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        input, button {
            padding: 8px;
            margin: 5px;
        }
        pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .progress-bar {
            background: #e5e7eb;
            border-radius: 10px;
            height: 20px;
            width: 100%;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: #7c3aed;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <h1>Test Balance API</h1>
    
    <div class="test-section">
        <h2>API Test</h2>
        <label>Sport ID: <input type="text" id="sportId" value="BAD" placeholder="e.g., BAD"></label>
        <label>Year: <input type="text" id="year" value="2026" placeholder="e.g., 2026"></label>
        <button onclick="testAPI()">Test API</button>
        
        <h3>Response:</h3>
        <pre id="response">Click "Test API" to see results</pre>
    </div>
    
    <div class="test-section">
        <h2>Visual Display</h2>
        <div class="balance-box">
            <h3>Budget Expenses</h3>
            <div class="balance-amount" id="balance">Rs 0.00</div>
            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div> 
            <div class="percentage" id="percent">0% of Budget Spent</div>
        </div>
    </div>

    <script>
        function testAPI() {
            const sportId = document.getElementById('sportId').value;
            const year = document.getElementById('year').value;
            const responseDiv = document.getElementById('response');
            
            responseDiv.textContent = 'Loading...';
            
            const url = `/uoc-sports/public/api/get-budget-balance.php?sport_id=${sportId}&year=${year}`;
            console.log('Fetching:', url);
            
            fetch(url)
                .then(res => {
                    console.log('Response status:', res.status);
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(data => {
                    console.log('Response data:', data);
                    responseDiv.textContent = JSON.stringify(data, null, 2);
                    
                    // Update visual display
                    if (data.success && data.data) {
                        const { allocated_amount, spent_amount, remaining_amount, spent_percentage } = data.data;
                        updateBalanceDisplay(
                            parseFloat(remaining_amount) || 0,
                            parseFloat(allocated_amount) || 100000,
                            parseFloat(spent_amount) || 0,
                            parseFloat(spent_percentage) || 0
                        );
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    responseDiv.textContent = 'Error: ' + err.message;
                });
        }
        
        function updateBalanceDisplay(remaining, allocated, spent, percentage) {
            const balanceElement = document.getElementById('balance');
            const progressElement = document.getElementById('progress');
            const percentElement = document.getElementById('percent');
            
            if (balanceElement) {
                balanceElement.innerHTML = `Rs ${spent.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} <span style="font-size: 0.9rem; color: #6b7280;">/ Rs ${allocated.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</span>`;
            }
            
            if (progressElement) {
                progressElement.style.width = `${Math.min(percentage, 100)}%`;
            }
            
            if (percentElement) {
                percentElement.textContent = `${percentage.toFixed(1)}% of Budget Spent`;
            }
            
            console.log('Balance updated:', { remaining, allocated, spent, percentage });
        }
    </script>
</body>
</html>
