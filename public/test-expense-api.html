<!DOCTYPE html>
<html>
<head>
    <title>Expense API Test</title>
</head>
<body>
    <h1>Expense API Test</h1>
    
    <div>
        <label>Sport ID: <input type="text" id="sportId" placeholder="e.g., badminton"></label>
        <label>Year: <input type="number" id="year" value="2026"></label>
        <button onclick="testAPI()">Test API</button>
    </div>
    
    <h2>Response:</h2>
    <pre id="response" style="background: #f5f5f5; padding: 1rem; border-radius: 4px;"></pre>
    
    <h2>Available Sports:</h2>
    <pre id="sports" style="background: #f5f5f5; padding: 1rem; border-radius: 4px;"></pre>

    <script>
        // Load available sports
        fetch('/uoc-sports/public/api/get-expense-data.php?sport_id=&year=2026')
            .then(r => r.json())
            .then(data => {
                document.getElementById('sports').textContent = 'All sports data:\n' + JSON.stringify(data, null, 2);
            });
        
        function testAPI() {
            const sportId = document.getElementById('sportId').value;
            const year = document.getElementById('year').value;
            const url = `/uoc-sports/public/api/get-expense-data.php?sport_id=${sportId}&year=${year}`;
            
            console.log('Testing URL:', url);
            document.getElementById('response').textContent = 'Loading...';
            
            fetch(url)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                    console.log('Response:', data);
                })
                .catch(err => {
                    document.getElementById('response').textContent = 'Error: ' + err.message;
                    console.error(err);
                });
        }
    </script>
</body>
</html>
